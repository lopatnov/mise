name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/mise-test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  web:
    name: Web — lint, build, a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check locale completeness
        run: npm run check:locales

      - name: Build
        run: npm run build

      # Scans the built app (served via `vite preview`) with axe-core through pa11y-ci.
      # Scoped to WCAG2A/WCAG2AA tags (see web/.pa11yci.json) to avoid noisy "best practice"
      # findings, and to unauthenticated pages only (login/register/forgot-password/public
      # recipe list) — the API needs MongoDB to boot, so authenticated pages are out of scope
      # for this first pass. Fails the build on violations; see web/.pa11yci.json to add an
      # `ignore` list if a rule proves to be a false positive.
      - name: Accessibility (WCAG 2.1 A/AA) — unauthenticated pages
        run: npm run test:a11y
