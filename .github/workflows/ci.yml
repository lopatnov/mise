name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    name: API — lint, test, build
    # Not ubuntu-latest: since runner image 20261018 the 24.04 and 26.04 images run kernel 7.0.0-azure, which
    # mongod's startup guard misreads as the broken 6.19-7.0.13 range (SERVER-131779) and refuses to start,
    # so every e2e hook timed out and the job hung until the 6 h limit (actions/runner-images#15005).
    # Return to ubuntu-latest once mongo:8.0 reaches 8.0.35+, and before ubuntu-22.04 is retired in April 2027.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    services:
      mongodb:
        # mongo:8 has moved to the 8.3 line; stay on the 8.0 line the app is built and tested against
        image: mongo:8.0
        ports:
          - 27017:27017
        # Fail fast if mongod dies at startup instead of letting the job wait on a database that is not there
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGODB_URI: mongodb://localhost:27017/mise-test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  web:
    name: Web — lint, build, a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check locale completeness
        run: npm run check:locales

      - name: Build
        run: npm run build

      # Scans the built app (served via `vite preview`) with axe-core through pa11y-ci.
      # "standard": "WCAG2AA" in web/.pa11yci.json requests WCAG2A/WCAG2AA tags, but pa11y's
      # axe runner unconditionally adds axe's "best-practice" tag too regardless of standard
      # (see node_modules/pa11y/lib/runners/axe.js, createAxeRunOnlyTags) — in practice this
      # hasn't produced noisy best-practice-only findings on the scanned pages, but it's not a
      # pure WCAG-tags-only run. Scoped to unauthenticated pages only (login/register/
      # forgot-password/public recipe list) — the API needs MongoDB to boot, so authenticated
      # pages are out of scope for this first pass. Fails the build on violations; see
      # web/.pa11yci.json's `hideElements` list for the specific elements with known
      # color-contrast findings deferred to a follow-up (tracked in issue #75) — scoped to
      # those exact selectors, not a blanket ignore of the color-contrast rule, so new
      # contrast regressions elsewhere still fail the build.
      - name: Accessibility (WCAG 2.1 A/AA) — unauthenticated pages
        run: npm run test:a11y
